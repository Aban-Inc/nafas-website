name: Deploy to GitHub Pages

# Builds the Nuxt site as static output (`nuxt generate`) and deploys it to
# GitHub Pages via GitHub's own Pages deployment actions (not a third-party
# gh-pages-push action) -- these publish through GitHub's native Pages
# deployment API, not a commit to a gh-pages branch, so there's no extra
# branch to keep in sync or accidentally diverge from main.
#
# Auth: GitHub's OIDC-backed `id-token: write` permission, exchanged
# internally by actions/deploy-pages -- no PAT or long-lived secret needed.
# Requires a one-time manual step in this repo's own settings: Settings ->
# Pages -> Source = "GitHub Actions".
#
# The custom domain (package.nafas.cloud) is carried via public/CNAME,
# which Nuxt copies verbatim into the generated static output -- NOT a
# repo-root CNAME file, which nuxt generate would never see.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20 -- Nuxt 4.5.2 and its own dependencies (@nuxt/nitro-server,
      # @nuxt/vite-builder) require Node ^22.19/^24.11/>=26; Node 20 doesn't
      # satisfy any engines range, and npm ci under it reported unrelated-
      # looking "Missing: X from lock file" errors for optional native
      # bindings (the engine mismatch changes which optional deps npm
      # considers wanted) rather than a real lockfile problem.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm install, not npm ci -- verified empirically that this repo's
      # package-lock.json cannot be made to satisfy npm ci reliably: Nuxt's
      # own toolchain (rolldown-vite) depends on oxc-parser, a fast-moving
      # pre-1.0 package whose exact resolved version differs between the
      # npm version on this dev machine (11.8.0) and the one bundled with
      # actions/setup-node's Node 22 (10.x) -- npm ci failed here with
      # "Invalid: lock file's oxc-parser/binding-*@0.139.0 does not satisfy
      # ...@0.150.0" even right after a from-scratch local reinstall with no
      # cached state. npm install re-resolves a currently-valid tree each
      # run instead of requiring byte-for-byte reproduction of a lockfile
      # that drifts out from under it; acceptable here since this is a
      # static marketing site's build tool, not the versioned NuGet package.
      - name: Install dependencies
        run: npm install

      # nuxt generate -- static output only, no server runtime -- this is
      # what makes the output servable as plain files by GitHub Pages now
      # and any static host (nginx, S3, etc.) later with zero code changes.
      - name: Generate static site
        run: npm run generate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
